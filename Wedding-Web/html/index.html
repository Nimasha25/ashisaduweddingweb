
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* Snowfall canvas */
        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Keep invitation content visible above the background */
        .container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>

    <canvas id="snowCanvas"></canvas>

    <div class="container">
        <h1>Welcome to Our Wedding Invitation</h1>

        <h2 id="heading2">함께, 영원으로 나아가다</h2>

        <p>
            Together, we’ve woven a tapestry of dreams, and on this day,
            we’ll stitch the final thread that unites our hearts.
            Join us in celebration of love’s enduring promise.
        </p>

        <h3 id="heading3">
            사랑하는 사람들 앞에서 우리는 영혼을 결합하고 사랑과 웃음의 평생 약속을 합니다.
        </h3>

        <button onclick="window.location.href='story.html'">
            Join Us
        </button>
    </div>

    <script>
        /* ==============================
           REALISTIC FALLING SNOW EFFECT
        ============================== */

        const canvas = document.getElementById("snowCanvas");
        const ctx = canvas.getContext("2d");

        let width;
        let height;
        let snowflakes = [];

        const snowflakeCount = 160;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            createSnowflakes();
        }

        class Snowflake {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial
                    ? Math.random() * height
                    : -10;

                this.radius = Math.random() * 3 + 1;

                this.speed = Math.random() * 1.5 + 0.5;

                this.wind = Math.random() * 0.8 - 0.4;

                this.opacity = Math.random() * 0.6 + 0.3;

                this.swing = Math.random() * 0.02 + 0.005;

                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += this.swing;

                this.y += this.speed;

                this.x += Math.sin(this.angle) * 0.8 + this.wind;

                if (this.y > height + 10) {
                    this.reset();
                }

                if (this.x > width + 10) {
                    this.x = -10;
                } else if (this.x < -10) {
                    this.x = width + 10;
                }
            }

            draw() {
                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;

                ctx.shadowBlur = 8;
                ctx.shadowColor = "rgba(255, 255, 255, 0.8)";

                ctx.fill();

                ctx.shadowBlur = 0;
            }
        }

        function createSnowflakes() {
            snowflakes = [];

            for (let i = 0; i < snowflakeCount; i++) {
                snowflakes.push(new Snowflake());
            }
        }

        function animateSnow() {
            ctx.clearRect(0, 0, width, height);

            snowflakes.forEach(snowflake => {
                snowflake.update();
                snowflake.draw();
            });

            requestAnimationFrame(animateSnow);
        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        animateSnow();


        /* ==============================
           TYPING ANIMATION
        ============================== */

        function typeText(elementId, text, delay, callback) {
            const element = document.getElementById(elementId);

            let index = 0;

            element.textContent = "";

            function type() {
                if (index < text.length) {
                    element.textContent += text.charAt(index);
                    index++;

                    setTimeout(type, delay);
                } else if (callback) {
                    callback();
                }
            }

            type();
        }

        window.onload = function() {
            typeText(
                "heading2",
                "함께, 영원으로 나아가다",
                150,
                function() {
                    typeText(
                        "heading3",
                        "사랑하는 사람들 앞에서 우리는 영혼을 결합하고 사랑과 웃음의 평생 약속을 합니다.",
                        150
                    );
                }
            );
        };
    </script>

</body>
</html>
